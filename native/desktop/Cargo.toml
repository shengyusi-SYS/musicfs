[package]
name = "musicfs-desktop-helper"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[[bin]]
name = "desktop-helper"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false, features = ["ksni"] }
auto-launch = "=0.6.0"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false }
tao = { version = "=0.37.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFRunLoop"] }
plist = "1.10.0"
dirs = "7"

[target.'cfg(target_os = "windows")'.dependencies]
windows-registry = "0.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
